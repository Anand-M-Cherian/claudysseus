embeddings:
    provider: openai
    model: text-embedding-3-small

chromadb:
    persist_dir: .claudysseus/chromadb/
    collection_name: codebase

tasks:
    db_path: .claudysseus/tasks.db

elasticsearch:
    url: http://localhost:9200
    index_name: codebase

llm:
    provider: openai # openai | anthropic
    model: gpt-4o
    judge_model: gpt-4o-mini # cheaper model used only for LLM-as-judge

qdrant:
    collection_name: codebase

rag:
    mode: hybrid # semantic | hybrid

vector_store:
    provider: qdrant
    retrieval_mode: hybrid # dense | sparse | hybrid

memory:
    db_path: .claudysseus/memory/memory.db
    summarize_at_tokens: 4000
    keep_last_messages: 20

skills:
    skills_dir: .claudysseus/skills
